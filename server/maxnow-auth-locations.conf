location = /_auth {
  internal;
  proxy_pass http://127.0.0.1:8765/check;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Cookie $http_cookie;
}

location = /auth/check {
  proxy_pass http://127.0.0.1:8765/check;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Cookie $http_cookie;
}

location = /auth/login {
  limit_req zone=maxnow_login burst=5 nodelay;
  limit_req_status 429;
  error_page 429 = @login_rate_limited;
  client_max_body_size 16k;
  proxy_pass http://127.0.0.1:8765/login;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
}

location = /auth/logout {
  client_max_body_size 1k;
  proxy_pass http://127.0.0.1:8765/logout;
  proxy_set_header Host $host;
}

location = /login {
  try_files /login.html =404;
}

location = /login.html {
  try_files /login.html =404;
}

location = /login.js {
  include /etc/nginx/snippets/maxnow-security-headers.conf;
  add_header Cache-Control "private, max-age=3600";
  try_files /login.js =404;
}

location = /styles.css {
  include /etc/nginx/snippets/maxnow-security-headers.conf;
  add_header Cache-Control "private, max-age=3600";
  try_files /styles.css =404;
}

location ^~ /assets/ {
  include /etc/nginx/snippets/maxnow-security-headers.conf;
  add_header Cache-Control "private, max-age=3600";
  try_files $uri =404;
}

location /data/ {
  auth_request /_auth;
  include /etc/nginx/snippets/maxnow-security-headers.conf;
  add_header Cache-Control "private, max-age=60, must-revalidate";
  try_files $uri =404;
}

location = /data/ballet-session.json {
  auth_request /_auth;
  include /etc/nginx/snippets/maxnow-security-headers.conf;
  add_header Cache-Control "private, max-age=60, must-revalidate";
  alias /var/lib/maxnow-ballet-session-status/public/ballet-session.json;
}

location = /data/ballet-session.js {
  auth_request /_auth;
  include /etc/nginx/snippets/maxnow-security-headers.conf;
  add_header Cache-Control "private, max-age=60, must-revalidate";
  alias /var/lib/maxnow-ballet-session-status/public/ballet-session.js;
}

location = /data/ballet-booking-fast.json {
  auth_request /_auth;
  include /etc/nginx/snippets/maxnow-security-headers.conf;
  add_header Cache-Control "private, no-store";
  alias /var/lib/maxnow-ballet-booking-fast-public/ballet-booking-fast.json;
}

location = /data/ballet-booking-fast.js {
  auth_request /_auth;
  include /etc/nginx/snippets/maxnow-security-headers.conf;
  add_header Cache-Control "private, no-store";
  alias /var/lib/maxnow-ballet-booking-fast-public/ballet-booking-fast.js;
}

location ~* \.(?:css|js|png)$ {
  auth_request /_auth;
  error_page 401 = @login_redirect;
  include /etc/nginx/snippets/maxnow-security-headers.conf;
  add_header Cache-Control "private, max-age=3600";
  try_files $uri =404;
}

location / {
  auth_request /_auth;
  error_page 401 = @login_redirect;
  try_files $uri $uri/ /index.html;
}

location @login_redirect {
  return 302 /login?next=$request_uri;
}

location @login_rate_limited {
  return 303 /login?error=rate;
}
