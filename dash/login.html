<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · MaxNow</title>
    <meta name="description" content="登录 MaxNow 私人状态工作站。" />
    <link rel="icon" type="image/png" href="./assets/maxnow-icon.png?v=1" />
    <link rel="stylesheet" href="./styles.css?v=126" />
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="auth-title">
        <div class="auth-context">
          <div class="auth-brand" aria-label="MaxNow">
            <img src="./assets/maxnow-icon.png?v=1" alt="" aria-hidden="true" />
            <strong>MaxNow</strong>
          </div>

          <div class="auth-context-copy">
            <p class="eyebrow">Private Workspace</p>
            <h1>回到你的状态工作站</h1>
            <p>个人状态、项目推进、Token 与自动化运行情况，都在一个安静的视图里。</p>
          </div>

          <div class="auth-signal-grid" aria-label="MaxNow workspace signals">
            <div class="auth-signal auth-signal-blue">
              <span class="auth-signal-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M4 11.2 12 4l8 7.2V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>
              </span>
              <span><strong>今日状态</strong><small>快速进入节奏</small></span>
            </div>
            <div class="auth-signal auth-signal-purple">
              <span class="auth-signal-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 3 4 7v10l8 4 8-4V7zm0 2.2L17.6 8 12 10.8 6.4 8zm-6 4.6 5 2.5v5.9l-5-2.5zm7 8.4v-5.9l5-2.5v5.9z"/></svg>
              </span>
              <span><strong>Token</strong><small>查看近期活动</small></span>
            </div>
            <div class="auth-signal auth-signal-cyan">
              <span class="auth-signal-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 3.5c3.7 4.2 6 7.7 6 10.5a6 6 0 0 1-12 0c0-2.8 2.3-6.3 6-10.5zm0 3.1C9.5 9.7 8 12.3 8 14a4 4 0 0 0 8 0c0-1.7-1.5-4.3-4-7.4z"/></svg>
              </span>
              <span><strong>生活记录</strong><small>保持轻量可读</small></span>
            </div>
            <div class="auth-signal auth-signal-green">
              <span class="auth-signal-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M17.6 18H7.3A4.8 4.8 0 0 1 8 8.5a6.2 6.2 0 0 1 11.8 2.4A3.8 3.8 0 0 1 17.6 18ZM7.3 16h10.3a1.8 1.8 0 0 0 .5-3.5 1 1 0 0 1-.7-1.1A4.2 4.2 0 0 0 9.5 9.3a1 1 0 0 1-1 .9H7.3A2.8 2.8 0 0 0 7.3 16Z"/></svg>
              </span>
              <span><strong>系统在线</strong><small>自动化持续运行</small></span>
            </div>
          </div>

          <p class="auth-context-note"><span aria-hidden="true"></span> dash.maxnow.cn · 私人访问</p>
        </div>

        <div class="auth-form-panel">
          <div class="auth-form-heading">
            <span class="auth-lock" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2Zm-7-2a2 2 0 0 1 4 0v2h-4Zm3 9.7V18a1 1 0 1 1-2 0v-1.3a2 2 0 1 1 2 0Z"/></svg>
            </span>
            <div>
              <p class="eyebrow">Welcome Back</p>
              <h2 id="auth-title">登录 MaxNow</h2>
            </div>
          </div>

          <p class="auth-form-intro">输入访问凭据，继续查看你的私人工作站。</p>

          <p class="auth-message" id="auth-message" role="alert" aria-live="polite" hidden></p>

          <form class="auth-form" action="/auth/login" method="post" id="auth-form">
            <input type="hidden" name="next" id="auth-next" value="/" />

            <label class="auth-field">
              <span>用户名</span>
              <span class="auth-input-wrap">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0-7a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm0 8c-4.2 0-7 2.3-7 5.7V21h14v-2.3c0-3.4-2.8-5.7-7-5.7Zm-5 6c.1-2.5 2.5-4 5-4s4.9 1.5 5 4Z"/></svg>
                <input name="username" type="text" value="maxnow" autocomplete="username" required />
              </span>
            </label>

            <label class="auth-field">
              <span>密码</span>
              <span class="auth-input-wrap">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2Zm-7-2a2 2 0 0 1 4 0v2h-4Zm7 12H7v-8h10Z"/></svg>
                <input name="password" id="auth-password" type="password" autocomplete="current-password" required autofocus />
                <button class="auth-password-toggle" id="auth-password-toggle" type="button" aria-label="显示密码">显示</button>
              </span>
            </label>

            <button class="auth-submit" id="auth-submit" type="submit">
              <span>进入工作站</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13.3 5.3 5.9 5.9a1 1 0 0 1 0 1.6l-5.9 5.9-1.4-1.4 4.3-4.3H4v-2h12.2l-4.3-4.3Z"/></svg>
            </button>
          </form>

          <div class="auth-session-note">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5Zm0 2.1L18 6v5c0 3.9-2.5 7.8-6 9-3.5-1.2-6-5.1-6-9V6Z"/></svg>
            <span>凭据仅发送到 MaxNow；此设备登录状态保留 7 天。</span>
          </div>
        </div>
      </section>
    </main>

    <script src="./login.js?v=1"></script>
  </body>
</html>
